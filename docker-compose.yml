services:

  nginx:
    image: nginx:alpine

    ports:
      - "80:80"
    
    deploy:
      replicas: 2
      restart_policy:
        condition : on-failure
    
      


    volumes:
      - ./src/public:/var/www/html/public
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - front-end
      - back-end

    depends_on:
      - app


  app:
    image: my-laravel-app:latest
    
    deploy:
      replicas: 2
      placement:
      
        constraints:
          - "node.role == worker"

    volumes:
      - ./src:/var/www/html

    networks:
      - back-end

    depends_on:
      - mysql


  mysql:
    image: mysql:8.0

    environment:
      
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - back-end


networks:

  front-end:
    

  back-end:
    driver: overlay
    internal: true


volumes:

  mysql-data: