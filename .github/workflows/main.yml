name: Production CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  tests-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, sqlite3, zip
          tools: composer:v2

      - name: Cache Vendor Folder
        uses: actions/cache@v4
        id: cache-vendor
        with:
          path: src/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('src/composer.lock') }}
         

      - name: Install Dependencies
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Local Env
        run: cp .env.example .env && php artisan key:generate
      - name: Lint
        run: vendor/bin/pint --test

      - name: Run Tests
        run: php artisan test

      - name: Run Composer Audit
        run: composer audit

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Tag Image with Commit SHA
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build Docker Image
        run: docker build -t library-api:${{ env.IMAGE_TAG }} .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'library-api:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  deploy-and-verify:
    name: Deploy & Post-Verify
    needs: [tests-and-lint, security-scan]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: self-hosted
    env:
      APP_KEY: ${{ secrets.APP_KEY }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Securely Inject .env
        run: |
          umask 077
          printf 'APP_KEY=%s\nAPP_ENV=production\nAPP_DEBUG=false\nDB_CONNECTION=mysql\nDB_HOST=mysql\nDB_PORT=3306\nDB_DATABASE=library_db\nDB_USERNAME=root\nDB_PASSWORD=%s\nMYSQL_ROOT_PASSWORD=%s\n' \
            "$APP_KEY" "$MYSQL_PASSWORD" "$MYSQL_ROOT_PASSWORD" > .env
            
      - name: Tag Image with Commit SHA
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Integration Test phase
        run: |
          docker compose build app
          docker compose up -d --wait

      - name: Post-Deploy Readiness Verification
        run: |
          echo "Verifying /api/health and /api/ready..."
          curl -fsS --retry 5 --retry-delay 2 http://localhost:8080/api/heal
          curl -fsS --retry 5 --retry-delay 2 http://localhost:8080/api/ready || {
            echo "Verification failed Triggering Rollback..."
            ./scripts/rollback.sh HEAD~1
            exit 1
          }
